<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <title>shelldeck</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/static/icon-192.png" />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="stylesheet" href="/static/vendor/xterm.css" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/vendor/xterm.js"></script>
    <script src="/static/vendor/addon-fit.js"></script>
    <script src="/static/vendor/addon-web-links.js"></script>
    <script src="/static/vendor/addon-webgl.js"></script>
    <script src="/static/vendor/addon-search.js"></script>
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-mark">
        <svg viewBox="0 0 32 32"><rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="#0a0a0b" stroke="#3f3f46"/><path class="chev" d="M9 11l5 5-5 5" fill="none" stroke="#fafafa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="cursor" d="M17 21h6" stroke="#fafafa" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="boot-name">shelldeck<span class="boot-cover"></span></span>
      </div>
    </div>
    <div id="app">
      <aside id="sidebar" aria-label="Projects">
        <div class="sb-head">
          <div class="brand"><img src="/static/icon.svg" alt="" width="18" height="18" /> shelldeck</div>
          <button class="icon-btn" data-action="toggle-sidebar" title="Hide sidebar (Ctrl+Alt+E)" aria-label="Hide sidebar"><i data-icon="panel"></i></button>
        </div>
        <button id="machine" class="sb-machine" data-action="machine" title="Machine: its projects, terminals and agents" aria-haspopup="menu"><i data-icon="terminal"></i><span class="m-text"><span class="m-name">Local</span><span class="m-sub">this computer</span></span><i data-icon="chevron"></i></button>
        <button class="sb-new" data-action="new-terminal"><i data-icon="plus"></i><span>New terminal</span><kbd>Ctrl Alt N</kbd></button>
        <button class="sb-search" data-action="palette"><i data-icon="search"></i><span>Search</span><kbd>Ctrl K</kbd></button>
        <div class="sb-section">
          <span>Projects</span>
          <button class="icon-btn sm" data-action="add-project" title="Add project" aria-label="Add project"><i data-icon="folder-plus"></i></button>
        </div>
        <nav id="projects" class="sb-projects"></nav>
        <div class="sb-foot">
          <button class="sb-link" data-action="view" data-view="terminals"><i data-icon="terminal"></i>Terminals</button>
          <button class="sb-link sb-agents" data-action="view" data-view="agents"><i data-icon="sparkle"></i>AI agents<span class="sb-count" hidden></span></button>
          <button class="sb-link" data-action="view" data-view="context"><i data-icon="layers"></i>Context</button>
          <details class="sb-more" id="sb-more">
            <summary class="sb-link"><i data-icon="grid"></i>More<span class="chev"><i data-icon="chevron"></i></span></summary>
            <div class="sb-more-items">
              <button class="sb-link" data-action="view" data-view="bookmarks"><i data-icon="bookmark"></i>Bookmarks</button>
              <button class="sb-link" data-action="view" data-view="scheduler"><i data-icon="clock"></i>Scheduler</button>
              <button class="sb-link" data-action="view" data-view="tasks"><i data-icon="kanban"></i>Tasks</button>
              <button class="sb-link" data-action="view" data-view="history"><i data-icon="history"></i>History</button>
              <button class="sb-link" data-action="view" data-view="monitor"><i data-icon="activity"></i>Task manager</button>
              <button class="sb-link" data-action="view" data-view="remotes"><i data-icon="share"></i>Remote systems</button>
              <button class="sb-link" data-action="view" data-view="devices"><i data-icon="devices"></i>Devices</button>
              <button class="sb-link" data-action="view" data-view="scratch"><i data-icon="note"></i>Scratchpad</button>
              <button class="sb-link" data-action="view" data-view="plugins"><i data-icon="grid"></i>Plugins</button>
            </div>
          </details>
          <div class="sb-settings">
            <button class="sb-link" data-action="settings"><i data-icon="settings"></i>Settings</button>
            <span id="conn" class="conn" title="Server connection"></span>
          </div>
        </div>
        <div class="sb-resize" data-resize="sidebar" aria-hidden="true"></div>
      </aside>
      <div id="scrim" data-action="toggle-sidebar"></div>

      <main id="main">
        <header id="topbar">
          <button class="icon-btn" id="sb-open" data-action="toggle-sidebar" title="Show sidebar (Ctrl+Alt+E)" aria-label="Show sidebar"><i data-icon="panel"></i></button>
          <div id="crumbs" class="crumbs"></div>
          <button id="sysmon" class="sysmon" data-action="view" data-view="monitor" title="Task manager (Ctrl+Alt+M)" aria-label="System usage, open task manager"></button>
          <button id="share-pill" class="share-pill" data-action="share" title="Sharing to other devices" hidden><span class="share-dot"></span><span>Sharing</span></button>
          <button class="icon-btn" id="share-btn" data-action="share" title="Share to another device" aria-label="Share" hidden><i data-icon="share"></i></button>
          <button class="icon-btn" id="radio-btn" data-action="radio" title="cliamp radio" aria-label="Radio"><i data-icon="radio"></i></button>
          <div class="top-actions" id="term-actions">
            <button class="icon-btn" data-action="bookmark-picker" title="Run bookmark (Ctrl+Alt+B)" aria-label="Run bookmark"><i data-icon="bookmark"></i></button>
            <button class="icon-btn" data-action="split" data-dir="row" title="Split right (Ctrl+Alt+\)" aria-label="Split right"><i data-icon="split-h"></i></button>
            <button class="icon-btn" data-action="tile" title="Tile all windows" aria-label="Tile all windows" hidden><i data-icon="grid"></i></button>
            <button class="icon-btn" data-action="split" data-dir="col" title="Split down (Ctrl+Alt+-)" aria-label="Split down"><i data-icon="split-v"></i></button>
          </div>
        </header>

        <section id="view-terminals" class="view">
          <div id="layout"></div>
          <div id="empty" class="empty">
            <div class="empty-card">
              <img src="/static/icon.svg" alt="" width="40" height="40" />
              <h2>No terminal open</h2>
              <p>Add a project folder, then open a terminal in it.</p>
              <div class="row">
                <button class="btn primary" data-action="add-project"><i data-icon="folder-plus"></i>Add project</button>
                <button class="btn" data-action="new-terminal"><i data-icon="plus"></i>New terminal</button>
              </div>
            </div>
          </div>
        </section>
        <section id="view-bookmarks" class="view page" hidden></section>
        <section id="view-scheduler" class="view page" hidden></section>
        <section id="view-tasks" class="view page" hidden></section>
        <section id="view-monitor" class="view page" hidden></section>
        <section id="view-history" class="view page" hidden></section>
        <section id="view-devices" class="view page" hidden></section>
        <section id="view-remotes" class="view page" hidden></section>
        <section id="view-agents" class="view page" hidden></section>
        <section id="view-scratch" class="view page" hidden></section>
        <section id="view-context" class="view page" hidden></section>
        <section id="view-plugins" class="view page" hidden></section>
        <div id="keybar" aria-label="Terminal keys">
          <button data-key="esc">Esc</button><button data-key="tab">Tab</button><button data-key="ctrl" aria-pressed="false">Ctrl</button>
          <button data-key="left" aria-label="Left">&larr;</button><button data-key="up" aria-label="Up">&uarr;</button><button data-key="down" aria-label="Down">&darr;</button><button data-key="right" aria-label="Right">&rarr;</button>
          <button data-key="|">|</button><button data-key="~">~</button><button data-key="/">/</button><button data-key="-">-</button>
        </div>
      </main>
    </div>

    <div id="term-store" hidden></div>
    <div id="dialog-root"></div>
    <div id="menu-root"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="lock" hidden>
      <form class="lock-card" id="lock-form"></form>
    </div>
  </body>
</html>
