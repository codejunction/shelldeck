name: pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/assets/**, shelldeck/static/icon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the site reuses the README screenshots and the app icon instead of keeping copies
      - run: |
          cp -r docs/assets site/assets
          cp shelldeck/static/icon.svg site/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
