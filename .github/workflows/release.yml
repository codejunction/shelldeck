name: Release

on:
  push:
    tags: ["v*"]
  # release candidate from a feature/fix branch: Actions > Release > Run workflow, pick the branch, enter e.g. 0.0.5rc1
  workflow_dispatch:
    inputs:
      version:
        description: "Release candidate version for PyPI, e.g. 0.0.5rc1 (not committed; pyproject is patched in the build)"
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != pyproject v$version"; exit 1; }
      - name: Set the release candidate version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_REF_NAME" in
            feature/?*|fix/?*) ;;
            *) echo "::error::release candidates publish from feature/<name> or fix/<name> branches, not '$GITHUB_REF_NAME'"; exit 1 ;;
          esac
          # PEP 440 release candidates only (x.y.zrcN): a pre-release, so plain `pip install shelldeck` never picks it up
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$' \
            || { echo "::error::'$VERSION' is not a release candidate like 0.0.5rc1"; exit 1; }
          current=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python3 - "$current" "$VERSION" <<'EOF'
          import re, sys
          key = lambda v: tuple(int(x) for x in re.match(r"(\d+)\.(\d+)\.(\d+)", v).groups())
          current, rc = sys.argv[1:]
          if key(rc) <= key(current):
              sys.exit(f"::error::{rc} must be for a release after {current} (e.g. the next patch)")
          EOF
          sed -i "s/^version = \"$current\"$/version = \"$VERSION\"/" pyproject.toml
          grep -q "^version = \"$VERSION\"$" pyproject.toml
      - run: uv build
      - name: Smoke-test the wheel
        run: uv tool run --from ./dist/*.whl sd --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    # PyPI trusted publisher: owner codejunction, repo shelldeck, workflow release.yml, environment pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shelldeck/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # tagged releases only; release candidates live on PyPI
    if: github.event_name == 'push'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "shelldeck $GITHUB_REF_NAME" --generate-notes
