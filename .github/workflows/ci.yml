name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  branch-name:
    # main only takes PRs from feature/<name> or fix/<name> (and Dependabot's own branches)
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            feature/?*|fix/?*|dependabot/?*) echo "ok: $HEAD" ;;
            *) echo "::error::Branch '$HEAD' must be named feature/<name> or fix/<name>"; exit 1 ;;
          esac

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  installer:
    # the one-line installers, fed the wheel from this commit instead of PyPI
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SHELLDECK_SOURCE = (Get-Item dist/*.whl).FullName
          ./install.ps1
          & (Join-Path (uv tool dir --bin) sd.exe) --help  # setup-uv moves UV_TOOL_BIN_DIR
      - if: runner.os == 'Linux'
        run: |
          SHELLDECK_SOURCE="$(ls "$PWD"/dist/*.whl)" sh ./install.sh
          "$(uv tool dir --bin)/sd" --help
