[project]
name = "shelldeck-docker"
version = "0.1.0"
description = "Docker commands for shelldeck: ?docker ps, sd docker logs web, ..."
requires-python = ">=3.12"
dependencies = ["shelldeck"]

[project.entry-points."shelldeck.plugins"]
docker = "shelldeck_docker:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
