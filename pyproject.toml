[project]
name = "shelldeck"
version = "0.0.5"
description = "Project-first multi-terminal for Windows and Linux: real shells, grouped by project, in your browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Abhishek Dutta", email = "phoenixdutta@gmail.com" }]
keywords = ["terminal", "terminal-emulator", "pty", "conpty", "powershell", "wsl", "xterm", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Shells",
  "Topic :: Terminals",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pywinpty>=2.0; sys_platform == 'win32'",
  "typer>=0.12",
  "rich>=13",
  "apscheduler>=3.10,<4",
  "psutil>=5.9",
  "segno>=1.6",
]

[project.urls]
Homepage = "https://github.com/codejunction/shelldeck"
Source = "https://github.com/codejunction/shelldeck"
Issues = "https://github.com/codejunction/shelldeck/issues"
Changelog = "https://github.com/codejunction/shelldeck/blob/main/CHANGELOG.md"

[project.scripts]
shelldeck = "shelldeck.cli:_main"
sd = "shelldeck.cli:_main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelldeck"]

[tool.hatch.build.targets.sdist]
include = ["shelldeck", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
extend-exclude = ["_ref_code"]

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B008"]  # typer's Option()/Argument() defaults are the documented idiom
